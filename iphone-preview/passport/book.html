<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journey passport</title>
<link rel="stylesheet" href="book.css"><link rel="stylesheet" href="field-notes.css"></head><body><section class="book" aria-label="Virtual journey passport"><header class="binding"><b>✥　Journey passport</b><button id="index-toggle" aria-controls="stamp-index" aria-expanded="false">Stamp index</button></header><section class="leaf index-panel" id="stamp-index" hidden aria-label="Stamp index">
<div class="folio"><span>Journey passport</span><b>Contents</b></div><h2>Stamp index</h2>
<label for="stamp-search">Find a stamp</label><input id="stamp-search" type="search" placeholder="City, state, or journey">
<label for="stamp-filter">Show</label><select id="stamp-filter"><option value="all">All stamps</option><option value="earned">Earned</option><option value="upcoming">Upcoming</option></select>
<p id="match-count" aria-live="polite"></p><div id="stamp-results"></div></section><article class="leaf" id="leaf" tabindex="-1"></article></section><script src="../journeys/freedom-map.js"></script><script src="../journeys/appalachian-map.js"></script><script src="../journeys/coastal-park-maps.js"></script><script src="../journeys/catalog.js"></script><script src="../journeys/guides.js"></script><script src="stops.js"></script><script src="field-notes.js"></script><script src="checkpoint-map.js"></script><script src="completed-map.js"></script><script src="imprint.js"></script><script>
const sampleBook=new URLSearchParams(location.search).get('demo')==='1';
if(sampleBook){
 const sampleCities=['Boston','Chicago','St. Louis','Santa Monica','Bellagio Fountains'];
 const samples=sampleCities.map(city=>stops.find(s=>s.city===city)).filter(Boolean);
 stops.splice(0,stops.length,...samples);
 document.querySelector('.binding b').textContent='✥　Sample passport';
 document.querySelector('#stamp-filter').innerHTML='<option value="all">Sample stamps</option>';
}
const distance=Math.max(0,Number(new URLSearchParams(location.search).get('mi')??842)||0);
let progress={};
try{progress=JSON.parse(new URLSearchParams(location.search).get('progress')||'{}')}catch{}
function stopProgress(s){return Math.max(0,Number(progress[s.completed?'boston':s.journey||'route66'])||0)}
function stopEarned(s){return sampleBook||stampEarned(s,progress)}
const activeJourney=new URLSearchParams(location.search).get('active')||'';
let pausedJourneys=[];
try{pausedJourneys=JSON.parse(new URLSearchParams(location.search).get('paused')||'[]')}catch{}
// Keep catalog indices for sharing after sorting the book for this reader.
const catalogOrder=stops.slice();
if(!sampleBook){
 const rank=s=>stopEarned(s)?(s.finish||s.completed?0:1):2;
 stops.sort((a,b)=>rank(a)-rank(b));
}
let page=0, detail=false;
const leaf=document.querySelector('#leaf');
const indexPanel=document.querySelector('#stamp-index');
const toggle=document.querySelector('#index-toggle');
const search=document.querySelector('#stamp-search');
const filter=document.querySelector('#stamp-filter');
const bookmarkKey=sampleBook?'earth-odometer.passport.sample-stamp':'earth-odometer.passport.last-stamp';
if(!sampleBook && stops.some(stopEarned))filter.value='earned';
function stampKey(stop){return (stop.journey||(stop.completed?'boston-marathon':'route66'))+'/'+stop.city;}
try{
 const saved=sessionStorage.getItem(bookmarkKey);
 const restored=stops.findIndex(s=>stampKey(s)===saved);
 if(restored>=0 && (sampleBook || !stops.some(stopEarned) || stopEarned(stops[restored])))page=restored;
}catch{ /* The book still works when storage is unavailable. */ }
function showPage(next){
 if(next<0||next>=stops.length)return;
 const direction=next-page;
 page=next;detail=false;
 try{sessionStorage.setItem(bookmarkKey,stampKey(stops[page]));}catch{}
 indexPanel.hidden=true;leaf.hidden=false;
 toggle.textContent='Stamp index';toggle.setAttribute('aria-expanded','false');
 draw(direction);leaf.focus({preventScroll:true});
}
function renderIndex(){
 const needle=search.value.trim().toLowerCase().replaceAll('.','');
 const results=document.querySelector('#stamp-results');
 results.replaceChildren();
 let group='',count=0;
 stops.forEach((s,i)=>{
  const journey=s.journey?extraJourneys[s.journey].name:s.completed?'Virtual Boston Marathon':'Route 66';
  const earned=stopEarned(s);
  const words=(s.city+' '+s.state+' '+journey).toLowerCase().replaceAll('.','');
  if(!words.includes(needle)||(filter.value==='earned'&&!earned)||(filter.value==='upcoming'&&earned))return;
  if(group!==journey){
   group=journey;
   const title=document.createElement('h3');title.textContent=journey;results.append(title);
  }
  const row=document.createElement('button');row.type='button';row.dataset.page=i;
  const state=sampleBook?'Sample':!earned?'Upcoming':s.completed||s.finish?'Completed':s.end?'Reached':'Started';
  row.innerHTML=`<b>${s.city}</b><small>${state} · Page ${i+1}</small><span aria-hidden="true">›</span>`;
  results.append(row);count++;
 });
 document.querySelector('#match-count').textContent=count?count+' matching '+(count===1?'stamp':'stamps'):'No matching stamps. Try another place or filter.';
}
toggle.onclick=()=>{
 if(!indexPanel.hidden){showPage(page);return;}
 leaf.hidden=true;indexPanel.hidden=false;renderIndex();
 toggle.textContent='Back to page';toggle.setAttribute('aria-expanded','true');search.focus({preventScroll:true});
};
search.oninput=renderIndex;filter.onchange=renderIndex;
indexPanel.onclick=e=>{const row=e.target.closest('[data-page]');if(row)showPage(Number(row.dataset.page));};

function routeMap(s){
 if(s.journey)return '<div class="city-atlas"><img src="../assets/'+s.image+'.jpg" alt="'+s.city+' journey illustration">'+journeyRouteMap(extraJourneys[s.journey],s.mile)+'</div>';
 if(s.finish)return completedRoute66Map('../assets/');
 if(s.completed)return completedBostonMap('../assets/');
 return '<div class="city-atlas"><img src="../assets/'+s.image+'.jpg" alt="'+s.city+' illustrated skyline">'+checkpointMap(s)+'</div>';
}
function coverNote(stop, journey){
 const title=fieldNotes[stop.city]?.title || journey?.note?.title;
 return title?'<p class="caption"><i>'+title+'</i></p>':'';
}
function newJourneyPage(s,earned){
 const d=extraJourneys[s.journey],number=String(page+1).padStart(2,'0');
 const remaining=Math.max(0,s.mile-stopProgress(s)).toLocaleString('en-US',{maximumFractionDigits:1});
 const label=s.finish?'Journey finish':'Checkpoint';
 const stamp=earned?'<button class="stamp" data-open aria-label="View '+s.city+' route map">'+passportImprint(s.city,'../assets/'+s.image+'.jpg',s.finish?'JOURNEY FINISH':'CHECKPOINT')+'</button>':'<div class="lock"><small>Stamp locked</small><b>'+s.city+'</b></div>';
 return '<div class="folio"><span>'+label+' stamp</span><b>Folio '+number+'</b></div><div class="field-heading"><h2>'+s.city+'</h2>'+inkMark(earned?(s.finish?'Completed':'Reached'):'')+'</div><p class="caption">'+d.name+' · Virtual mile '+s.mile.toLocaleString()+'</p>'+
 (detail?routeMap(s)+'<p class="map-copy">'+d.name+' · '+label+' reached at '+s.mile.toLocaleString()+' mi</p><button class="action" data-close>← Back to stamp</button>':'<div class="plate">'+stamp+'</div><p class="hint">'+(earned?'Earned on '+d.name+'. Tap the stamp to see the route.':remaining+' journey miles to go. '+(activeJourney.split(',').includes(s.journey)?'Your new miles count toward this checkpoint.':pausedJourneys.includes(s.journey)?'This journey is paused. Resume it from Journeys to keep earning stamps.':activeJourney?'Choose this route in Journeys to begin.':'Start this route from Journeys to begin earning stamps.'))+'</p>')+
 (earned&&!sampleBook?'<button class="action" data-share-stamp>Share '+(s.finish?'journey':'checkpoint')+'</button>':'')+(detail?(fieldNote(s.city)||journeyFieldNote(d)):coverNote(s,d))+
 '<div class="folio-nav"><button data-step="-1" aria-label="Previous passport page">‹</button><span aria-live="polite">Page '+(page+1)+' of '+stops.length+'</span><button data-step="1" aria-label="Next passport page" '+(page===stops.length-1?'disabled':'')+'>›</button></div>';
}
function draw(direction){
 const s=stops[page],earned=stopEarned(s);
 const number=String(page+1).padStart(2,'0');
 const route=s.completed?'Journey 1 · Marathon finish':'Journey 2 · Route 66';
 const label=s.completed?(sampleBook?'View sample Boston stamp map':'View earned Boston stamp map'):'View '+s.city+' route map';
 const stamp=earned?`<button class="stamp" data-open aria-label="${label}">${passportImprint(s.city,'../assets/'+s.image+'.jpg',s.completed?'MARATHON FINISH':'US ROUTE 66')}</button>`:'<div class="lock"><small>Stamp locked</small><b>'+s.city+'</b></div>';
 const mapLabel=s.completed?'Virtual Boston Marathon completed · 26.2 mi':(s.finish?'Route 66 completed · Chicago to Santa Monica · 2,448 mi':s.end?'From Chicago to '+s.city+' · Mile '+s.mile:'Chicago · Starting point of Route 66');
 leaf.innerHTML=s.journey?newJourneyPage(s,earned):`<div class="folio"><span>${s.completed||s.finish&&earned?'Journey completion stamp':earned?(s.end?'Earned checkpoint stamp':'Journey start stamp'):'Upcoming checkpoint stamp'}</span><b>Folio ${number}</b></div><div class="field-heading"><h2>${s.completed?'Virtual Boston Marathon':s.city}</h2>${inkMark(earned?(s.completed||s.finish?"Completed":s.end?"Reached":"Started"):"")}</div><p class="caption">${s.state} · ${route}</p>`+
 (detail?routeMap(s)+'<p class="map-copy">'+mapLabel+'</p><button class="action" data-close>← Back to stamp</button>':
 '<div class="plate">'+stamp+'</div><p class="hint">'+(earned?(s.completed?'You completed 26.2 virtual miles. Choose your next journey from Journeys.':s.finish?'You finished the 2,448-mile virtual Route 66 journey in Santa Monica.':s.end?'Earned at mile '+s.mile+' of Route 66.':'Mile zero of Route 66. From Chicago, the first destination stamp is St. Louis.'):(s.completed?Math.max(0,s.mile-stopProgress(s)).toLocaleString()+' Boston Marathon miles to go.':!Object.hasOwn(progress,'route66')?'Start Route 66 from Journeys to earn this stamp.':Math.max(0,Math.ceil(s.mile-stopProgress(s)))+' Route 66 miles to go.'))+(earned?' Tap the stamp to see its route.':'')+'</p>')+
 (earned&&!sampleBook?'<button class="action" data-share-stamp>Share '+(s.completed||s.finish?'journey':'checkpoint')+'</button>':'')+(detail?fieldNote(s.city):coverNote(s))+`<div class="registry">${s.completed?(earned?'COMPLETED · VIRTUAL JOURNEY':'LOCKED · MARATHON FINISH'):(s.finish?'ROUTE FINISH':s.mile===0?'ROUTE START':'CHECKPOINT '+String(page-1).padStart(2,'0'))+'　/　MILE '+s.mile}</div>
 <div class="folio-nav"><button data-step="-1" aria-label="Previous passport page" ${!page?'disabled':''}>‹</button><span aria-live="polite">Page ${page+1} of ${stops.length}</span><button data-step="1" aria-label="Next passport page" ${page===stops.length-1?'disabled':''}>›</button></div>`;
 if(detail&&!earned){const caption=leaf.querySelector('.map-copy');if(caption)caption.textContent='Route preview · Virtual mile '+s.mile.toLocaleString();}
 const journeyKey=s.completed?'boston':s.journey||'route66';
 const footer=leaf.querySelector('.registry')||leaf.querySelector('.folio-nav');
 if(!earned&&!detail) footer.insertAdjacentHTML('beforebegin','<button class="action" data-open>Read about this place</button>');
 if(detail) footer.insertAdjacentHTML('beforebegin',journeyGuide(journeyKey));
 window.scrollTo(0,0);
 if(sampleBook){
  leaf.querySelector('.folio span').textContent='Sample stamp · Preview only';
  const status=leaf.querySelector('.field-heading');
  status.innerHTML='<h2>'+(s.completed?'Virtual Boston Marathon':s.city)+'</h2>'+inkMark('Sample');
  const hint=leaf.querySelector('.hint');
  if(hint)hint.textContent='A preview of the stamp you can earn on this virtual journey. Tap to explore its route.';
  const registry=leaf.querySelector('.registry');
  if(registry)registry.textContent='SAMPLE · NOT YET EARNED';
  const mapCopy=leaf.querySelector('.map-copy');
  if(mapCopy)mapCopy.textContent='Sample route preview · '+s.city+' · Virtual mile '+s.mile.toLocaleString();
  leaf.querySelector('[data-step="-1"]').disabled=page===0;
 }
 leaf.className='leaf';if(direction){void leaf.offsetWidth;leaf.classList.add(direction>0?'turn':'back')}
}
function turn(d){showPage(page+d)}
leaf.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-share-stamp')){if(sampleBook)return;parent.postMessage({shareStamp:catalogOrder.indexOf(stops[page])},'*');return}if(b.dataset.step)turn(Number(b.dataset.step));else{detail=b.hasAttribute('data-open');draw();leaf.querySelector(detail?'[data-close]':'[data-open]')?.focus({preventScroll:true})}};
let start;leaf.addEventListener('touchstart',e=>{start=e.touches[0]},{passive:true});leaf.addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start.clientX,dy=e.changedTouches[0].clientY-start.clientY;if(Math.abs(dx)>55&&Math.abs(dx)>1.5*Math.abs(dy))turn(dx<0?1:-1);start=null});
document.onkeydown=e=>{if(!indexPanel.hidden){if(e.key==='Escape')showPage(page);return}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();turn(e.key==='ArrowRight'?1:-1)}};draw();
</script><script src="units.js"></script></body></html>
